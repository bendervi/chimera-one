<!DOCTYPE html>
<!--
  Chimera Cast receiver (Google Cast Web Receiver, App ID 269B640F).
  Launched by Chimera's iOS sender (Google Cast SDK) and macOS sender (native
  Cast v2). Our own UI over a plain <video> handed to CAF's PlayerManager —
  no cast-media-player chrome. Layout/logic: receiver.css / receiver.js.
  Local preview without a Cast device:
  index.html?demo=idle|loading|video|live|paused|music|photo|error  (the first UI, for senders without `ui`)
  index.html?demo=v2-video|v2-live|v2-paused|v2-scrub|v2-subtitles|v2-toast|v2-up-next|v2-zap|v2-loading|v2-error  (ui 2)
  plus &lang=<code>.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chimera</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="receiver.css">
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="https://www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>
</head>
<body data-state="idle" data-kind="video" data-ui="1">
    <!-- Ambient backdrop: blurred artwork (loading, music, photo) or the idle glow. -->
    <div id="ambient" aria-hidden="true">
        <div class="glow glow-a"></div>
        <div class="glow glow-b"></div>
        <canvas id="ambient-art" width="16" height="9"></canvas>
    </div>

    <video id="video" playsinline></video>
    <!-- ui 2: the last frame of the channel being left, dimmed while the next one opens. -->
    <canvas id="freeze" aria-hidden="true"></canvas>
    <div id="dim" aria-hidden="true"></div>
    <!-- ui 2: the active subtitles, drawn by us in the app's subtitle style. -->
    <div id="captions" aria-live="off"></div>
    <img id="photo" alt="">

    <!-- Idle: nothing is cast yet, or playback ended. -->
    <section id="idle" class="screen">
        <div class="logo" aria-hidden="true"></div>
        <h1 class="wordmark">Chimera</h1>
        <p class="tagline" data-i18n="ready"></p>
    </section>

    <!-- Loading: artwork + title while the stream opens. -->
    <section id="loading" class="screen">
        <img class="poster" id="loading-art" alt="">
        <div class="loading-text">
            <p class="eyebrow"><span class="live-pill" data-i18n="live"></span></p>
            <h2 class="title" data-bind="title"></h2>
            <p class="subtitle" data-bind="subtitle"></p>
            <p class="status"><span class="spinner small" aria-hidden="true"></span><span data-i18n="loading"></span></p>
        </div>
    </section>

    <!-- Music Now Playing. -->
    <section id="music" class="screen">
        <img class="album" id="music-art" alt="">
        <div class="music-text">
            <h2 class="title" data-bind="title"></h2>
            <p class="subtitle" data-bind="subtitle"></p>
            <div class="progress-row" dir="ltr">
                <span class="time elapsed">0:00</span>
                <div class="track"><div class="fill"></div></div>
                <span class="time remaining"></span>
            </div>
        </div>
    </section>

    <!-- Video info bar: shown on start, pause, seek; hides itself while playing. -->
    <section id="infobar">
        <img class="thumb" id="info-art" alt="">
        <div class="info-text">
            <p class="eyebrow"><span class="live-pill" data-i18n="live"></span></p>
            <h2 class="title" data-bind="title"></h2>
            <p class="subtitle" data-bind="subtitle"></p>
            <div class="progress-row" dir="ltr">
                <span class="time elapsed">0:00</span>
                <div class="track"><div class="fill"></div></div>
                <span class="time remaining"></span>
            </div>
        </div>
        <div class="paused-glyph" aria-hidden="true"></div>
    </section>

    <!-- ui 2: the AVPlayer-style transport (replaces #infobar). -->
    <section id="transport">
        <div class="t-head">
            <img class="t-logo" id="t-logo" alt="">
            <div class="t-text">
                <p class="t-eyebrow"><span class="live-pill" data-i18n="live"></span><span class="t-eyebrow-text"></span></p>
                <h2 class="t-title"></h2>
                <p class="t-line"></p>
                <p class="t-overview"></p>
            </div>
        </div>
        <div class="bar" dir="ltr">
            <div class="bar-track"><div class="bar-fill"></div><div class="bar-head"></div></div>
            <div class="bar-times">
                <span class="t-elapsed"></span>
                <span class="t-remaining"></span>
            </div>
        </div>
    </section>

    <div id="pause-glyph" aria-hidden="true"></div>

    <!-- ui 2: a track choice made on the phone, confirmed briefly. -->
    <div id="toast" role="status"></div>

    <!-- ui 2: Up Next at the end of an episode; the phone has Play Next and Cancel. -->
    <section id="upnext">
        <img class="u-art" id="u-art" alt="">
        <div class="u-text">
            <p class="u-label" data-i18n="upNext"></p>
            <p class="u-title"></p>
        </div>
        <div class="u-ring" aria-hidden="true">
            <svg viewBox="0 0 40 40"><circle class="u-ring-bg" cx="20" cy="20" r="17"></circle><circle class="u-ring-fill" cx="20" cy="20" r="17"></circle></svg>
            <span class="u-seconds"></span>
        </div>
    </section>

    <div id="buffering" aria-hidden="true"><span class="spinner"></span></div>

    <!-- Failure: the sender decides what happens next (e.g. plays it on the device). -->
    <section id="error" class="screen">
        <div class="error-glyph" aria-hidden="true">!</div>
        <h2 class="title" data-i18n="errorTitle"></h2>
        <p class="subtitle" data-i18n="errorBody"></p>
        <p class="error-item" data-bind="title"></p>
    </section>

    <script src="receiver.js"></script>
</body>
</html>
