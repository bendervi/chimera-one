# Publishes the OLD address, bendervi.github.io/chimera-one/: every page,
# including /receiver/, redirects to the same path on getchimera.app (see
# legacy-github-pages/README.md).
# The site itself is built and hosted by Cloudflare Pages.
# Repo Settings › Pages › Source must be "GitHub Actions".
name: Legacy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p out
          for page in index privacy privacy-tv support 404; do
            cp legacy-github-pages/redirect.html "out/$page.html"
          done
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
